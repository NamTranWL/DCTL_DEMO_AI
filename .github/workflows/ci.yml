name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dctl
          POSTGRES_PASSWORD: dctl_ci_password
          POSTGRES_DB: dctl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dctl -d dctl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: dctl
      DB_PASSWORD: dctl_ci_password
      DB_NAME: dctl_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-only-secret-not-for-production-use-0123456789
      JWT_EXPIRES: 1h
      LLM_PROVIDER: mock
      PUSH_PROVIDER: console
      MAIL_PROVIDER: console

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable Postgres extensions
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=$DB_PASSWORD psql -h localhost -U $DB_USERNAME -d $DB_NAME \
            -f docker/postgres/init/01-extensions.sql

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test backend (unit)
        run: pnpm test:backend -- --ci

      - name: Test backend (e2e)
        run: pnpm --filter @dctl/backend test:e2e -- --ci
